syntax = "proto3";

// WIRE COMPATIBILITY: the proto package ("protocol") and service names form the gRPC
// paths agents dial. Never rename them, and never renumber or reuse field numbers.
package protocol;

option go_package = "github.com/awandataindonesia/cekping-protocol;protocol";

// CekpingService is the agent stream: /protocol.CekpingService/Connect.
service CekpingService {
  // Long-lived bidirectional stream opened by the agent. The first AgentMsg must be
  // an AuthRequest; the server replies with an AuthResponse before sending tasks.
  rpc Connect(stream AgentMsg) returns (stream ServerMsg);
}

// Deprecated: legacy path /protocol.PingveService/Connect ("Pingve" is the project's
// early codename). Identical to CekpingService; servers must keep serving it for
// agents released before v1.1.0 of this protocol.
service PingveService {
  option deprecated = true;
  rpc Connect(stream AgentMsg) returns (stream ServerMsg);
}

// Agent -> Server
message AgentMsg {
  oneof payload {
    AuthRequest auth = 1;
    Heartbeat heartbeat = 2;
    PingResult ping_result = 3;
    MTRResult mtr_result = 4;
  }
}

// Server -> Agent
message ServerMsg {
  oneof payload {
    AuthResponse auth = 1;
    PingTask ping_task = 2;
    MTRTask mtr_task = 3;
    CancelTask cancel_task = 4;
  }
}

message CancelTask {
  string id = 1;     // Task ID to cancel
  string target = 2; // Target (optional, for safety)
}

message AuthRequest {
  string token = 1;    // Probe token from the volunteer dashboard
  string hostname = 2;
  string version = 3;  // Agent version
}

message AuthResponse {
  bool success = 1;
  string error_message = 2;
}

message Heartbeat {
  int64 timestamp = 1; // Unix seconds
  double uptime = 2;
}

message PingTask {
  string id = 1;     // Task ID; results must echo it back unchanged
  string target = 2; // Resolved IPv4 address
  int32 count = 3;   // Number of echo requests (1 per second)
}

message PingResult {
  string task_id = 1;
  string target = 2;

  // Summary fields (filled if is_final=true)
  int32 sent = 3;
  int32 lost = 4;
  double min_rtt = 5;
  double max_rtt = 6;
  double avg_rtt = 7;
  double std_dev = 8;
  repeated double rtts = 9;

  // Streaming fields (filled for individual packets)
  int32 seq = 10;
  int32 ttl = 11;
  double time = 12; // RTT in ms; 0 means timeout (RTO)
  bool is_final = 13;
}

message MTRTask {
  string id = 1;     // Task ID; results must echo it back unchanged
  string target = 2; // Resolved IPv4 address
  int32 count = 3;   // Number of cycles, usually 20 per request
}

message MTRHop {
  int32 hop = 1;
  string ip = 2;
  string ptr = 3;
  string as_name = 4;
  double loss = 5; // Percentage
  int32 sent = 6;
  double last = 7; // ms
  double avg = 8;
  double best = 9;
  double worst = 10;
  double stdev = 11;
}

message MTRResult {
  string task_id = 1;
  string target = 2;
  string raw_output = 3; // Error message when the MTR run fails
  MTRHop hop = 4;        // Per-hop update (is_final=false)
  bool is_final = 5;
}
